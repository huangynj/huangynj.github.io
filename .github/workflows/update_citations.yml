name: Update Google Scholar Citations

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          pip install -r requirements.txt

      - name: Fetch citations
        env:
          ALL_PROXY: socks5://127.0.0.1:9050
        run: python scripts/fetch_citations.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add citations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of Google Scholar citations" && git push)
